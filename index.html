<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@500;700&family=DM+Sans:wght@400;500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--sage:#B3C7A1;--blue:#0A3B6E;--teal:#6FA1A0;--cream:#F6F1E4;--paper:#FBF8F0;--bg:var(--cream);--ink:var(--blue);--card:var(--sage);
--fd:'Josefin Sans','IBM Plex Sans Arabic',sans-serif;--fb:'DM Sans','IBM Plex Sans Arabic',sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d2a4a;--ink:#EAF0DF;--paper:#12335a;--card:#1b4a63}}
:root[data-theme="dark"]{--bg:#0d2a4a;--ink:#EAF0DF;--paper:#12335a;--card:#1b4a63}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scrollbar-gutter:stable;-webkit-text-size-adjust:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--fb)}
[dir=rtl] body,[dir=rtl] button{font-family:'IBM Plex Sans Arabic',var(--fb)}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
/* header */
header{background:var(--sage) url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22110%22%20height%3D%22110%22%3E%3Cg%20transform%3D%22translate%2828%2028%29%20rotate%28-35%29%22%3E%3Cellipse%20rx%3D%2213%22%20ry%3D%2219%22%20fill%3D%22%236FA1A0%22%20fill-opacity%3D%22.45%22%20stroke%3D%22%230A3B6E%22%20stroke-opacity%3D%22.5%22%20stroke-width%3D%221.6%22%2F%3E%3Cpath%20d%3D%22M0-17C-7-7%207%207%200%2017%22%20fill%3D%22none%22%20stroke%3D%22%230A3B6E%22%20stroke-opacity%3D%22.5%22%20stroke-width%3D%221.6%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fg%3E%3Cg%20transform%3D%22translate%2883%2083%29%20rotate%2830%29%22%3E%3Cellipse%20rx%3D%2213%22%20ry%3D%2219%22%20fill%3D%22%236FA1A0%22%20fill-opacity%3D%22.45%22%20stroke%3D%22%230A3B6E%22%20stroke-opacity%3D%22.5%22%20stroke-width%3D%221.6%22%2F%3E%3Cpath%20d%3D%22M0-17C-7-7%207%207%200%2017%22%20fill%3D%22none%22%20stroke%3D%22%230A3B6E%22%20stroke-opacity%3D%22.5%22%20stroke-width%3D%221.6%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fg%3E%3Cg%20transform%3D%22translate%2883%2022%29%20rotate%2870%29%22%3E%3Cellipse%20rx%3D%2213%22%20ry%3D%2219%22%20fill%3D%22%236FA1A0%22%20fill-opacity%3D%22.45%22%20stroke%3D%22%230A3B6E%22%20stroke-opacity%3D%22.5%22%20stroke-width%3D%221.6%22%2F%3E%3Cpath%20d%3D%22M0-17C-7-7%207%207%200%2017%22%20fill%3D%22none%22%20stroke%3D%22%230A3B6E%22%20stroke-opacity%3D%22.5%22%20stroke-width%3D%221.6%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fg%3E%3Cg%20transform%3D%22translate%2824%2086%29%20rotate%2810%29%22%3E%3Cellipse%20rx%3D%2213%22%20ry%3D%2219%22%20fill%3D%22%236FA1A0%22%20fill-opacity%3D%22.45%22%20stroke%3D%22%230A3B6E%22%20stroke-opacity%3D%22.5%22%20stroke-width%3D%221.6%22%2F%3E%3Cpath%20d%3D%22M0-17C-7-7%207%207%200%2017%22%20fill%3D%22none%22%20stroke%3D%22%230A3B6E%22%20stroke-opacity%3D%22.5%22%20stroke-width%3D%221.6%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E") center/110px;position:relative;overflow:hidden;border-bottom:2px solid var(--blue);padding:14px 0 34px;color:#0A3B6E}
header .wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px}
.lang{align-self:flex-end;display:flex;border:1.5px solid #0A3B6E;border-radius:99px;overflow:hidden;background:var(--paper)}
.lang button{border:0;background:none;padding:6px 14px;min-height:36px;font-weight:700;color:#0A3B6E;transition:.2s}
.lang button[aria-pressed=true]{background:#0A3B6E;color:#F6F1E4}
.logo{width:92px;height:92px;border-radius:50%;box-shadow:0 0 0 3px var(--paper),0 0 0 5px #0A3B6E}
.tag{background:var(--paper);border:1.5px solid #0A3B6E;border-radius:24px;padding:8px 18px;text-align:center;font-weight:500;font-size:15px;max-width:100%}
.tag b{display:block;font-family:'IBM Plex Sans Arabic';font-size:17px}
.vinyl{position:absolute;width:120px;height:120px;border-radius:50%;background:repeating-radial-gradient(circle,#0A3B6E 0 2px,#124a85 2px 5px);opacity:.14;top:-30px;inset-inline-start:-36px}
.vinyl:after{content:"";position:absolute;inset:40px;border-radius:50%;background:var(--teal)}
/* utility */
.util{display:flex;gap:8px;flex-wrap:wrap;margin:-20px 0 0;position:relative;justify-content:center}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:99px;border:1.5px solid var(--blue);background:var(--paper);color:var(--blue);font-weight:700;transition:transform .15s,background .2s}
.pill.main{background:var(--blue);color:#F6F1E4}
.pill:active{transform:scale(.96)}
.hours{display:none;margin:10px auto 0;max-width:340px;border:1.5px dashed var(--teal);border-radius:16px;padding:10px 16px;font-size:14px;background:var(--paper)}
.hours.open{display:block}
.hours div{display:flex;justify-content:space-between;gap:12px}
/* cat nav */
nav{contain:layout;position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1.5px solid var(--blue);padding-top:env(safe-area-inset-top,0px);margin-top:16px}
nav .scroller{position:relative;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;max-width:960px;margin:0 auto}
nav .scroller::-webkit-scrollbar{display:none}
.chip{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;flex:none;min-height:44px;padding:0 18px;border-radius:99px;border:1.5px solid var(--blue);background:transparent;color:var(--ink);font-weight:500;transition:background .2s,color .2s}
.chip:after{content:attr(data-n);font-weight:700;height:0;visibility:hidden;overflow:hidden;pointer-events:none}
.chip.on{background:var(--blue);color:#F6F1E4;font-weight:700}
:root[data-theme=dark] .chip:after{content:attr(data-n);font-weight:700;height:0;visibility:hidden;overflow:hidden;pointer-events:none}
.chip.on{background:var(--sage);color:#0A3B6E}
/* sections */
section.cat{padding:28px 0 6px;content-visibility:auto;contain-intrinsic-size:auto 700px}
section.cat h2{font:700 30px/1.1 var(--fd);letter-spacing:.04em;text-transform:uppercase;margin:0 0 16px;display:flex;align-items:center;gap:12px}
[dir=rtl] section.cat h2{letter-spacing:0;text-transform:none}
section.cat h2:after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--teal) 0 6px,transparent 6px 12px)}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{background:var(--card);border:1.5px solid var(--blue);border-radius:28px 28px 28px 8px;overflow:hidden;display:flex;flex-direction:column;color:var(--blue);contain:layout paint}
[dir=rtl] .card{border-radius:28px 28px 8px 28px}
@media(hover:hover){.card{transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);box-shadow:4px 4px 0 var(--blue)}.card:hover .ph img,.card:hover .ph svg{transform:scale(1.05)}}
.card:active .ph{opacity:.92}
.ph{position:relative;contain:strict;aspect-ratio:4/3;border:0;padding:0;background:var(--teal);display:block;width:100%;overflow:hidden;border-bottom:1.5px solid var(--blue)}
.ph img,.ph svg{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}

.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.name{font:700 19px/1.2 var(--fd);letter-spacing:.03em;text-transform:uppercase;margin:0}
[dir=rtl] .name{text-transform:none;letter-spacing:0}
.price{font:700 18px var(--fd);white-space:nowrap;background:var(--paper);border:1.5px solid var(--blue);border-radius:99px;padding:0 12px}
.desc{margin:0;font-size:14.5px;opacity:.9}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.opt{font-size:13px;font-weight:500;border:1.5px solid var(--blue);border-radius:99px;padding:1px 10px;background:var(--paper)}
.opt.add{border-style:dashed;background:transparent}
/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,59,110,.7);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex;animation:fade .2s}
.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--paper);color:var(--blue);width:100%;max-width:560px;max-height:100%;overflow:auto;border-radius:28px 28px 0 0;border:2px solid var(--blue);animation:up .25s ease-out;position:relative}
@media(max-width:600px){.sheet{height:100%;height:100dvh;border-radius:0}}
@media(min-width:601px){.modal{align-items:center}.sheet{border-radius:28px;max-height:92%}}
.sheet .ph{contain:none;aspect-ratio:1/1;max-height:60vh;cursor:default}
.x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);inset-inline-end:12px;width:48px;height:48px;border-radius:50%;border:2px solid var(--blue);background:var(--paper);font-size:24px;line-height:1;z-index:2;color:var(--blue)}
.sheet .body{padding:18px 20px 28px;gap:10px}
.sheet h3{margin:0;font:700 26px/1.1 var(--fd);text-transform:uppercase}
[dir=rtl] .sheet h3{text-transform:none}
.sheet h4{margin:8px 0 4px;font:700 13px var(--fd);letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
.row{display:flex;justify-content:space-between;border-bottom:1px dotted var(--blue);padding:6px 0}
.note{margin:24px 0;padding:12px 16px;border:1.5px dashed var(--teal);border-radius:16px;font-size:13px;opacity:.85}
.credit{text-align:center;padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 24px);font-size:13px}
.credit a{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;color:var(--ink);opacity:.75;text-decoration:none;border-radius:99px;transition:opacity .2s}
.credit a:active{opacity:1}
@media(hover:hover){.credit a:hover{opacity:1}}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;padding:12px 18px;border-radius:99px;z-index:60;display:none;font-size:14px;max-width:90%}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(30px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <div class="vinyl"></div>

const $=s=>document.querySelector(s),g=(o)=>o[L]||o.en;
const fmt=p=>p==null?"":p+" "+CURRENCY[L];
const art=`<svg viewBox="0 0 200 150" preserveAspectRatio="xMidYMid slice"><rect width="200" height="150" fill="#6FA1A0"/><circle cx="100" cy="75" r="46" fill="#0A3B6E"/><circle cx="100" cy="75" r="36" fill="none" stroke="#6FA1A0" stroke-width="1.5"/><circle cx="100" cy="75" r="26" fill="none" stroke="#6FA1A0" stroke-width="1.5"/><circle cx="100" cy="75" r="14" fill="#B3C7A1"/><circle cx="100" cy="75" r="3" fill="#0A3B6E"/></svg>`;
const img=(it,eager)=>it.image?`<img src="${it.image}" alt="${g(it.name)}" width="800" height="600" ${eager?'fetchpriority="high"':'loading="lazy"'} decoding="async">`:art;
function prices(it){return it.price!=null?`<span class="price">${fmt(it.price)}</span>`:""}
function render(){
 const keep=cur;
 document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr";
 document.querySelectorAll("[data-t]").forEach(e=>e.textContent=T[L][e.dataset.t]);
 document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l==L));
 $("#cats").innerHTML=`<button class="chip on" data-c="top" data-n="${T[L].all}">${T[L].all}</button>`+MENU.map(c=>`<button class="chip" data-c="${c.id}" data-n="${g(c.name)}">${g(c.name)}</button>`).join("");
 $("#menu").innerHTML=MENU.map((c,ci)=>`<section class="cat" id="${c.id}"><h2>${g(c.name)}</h2><div class="grid">`+c.items.map((it,i)=>`
  <article class="card"><button class="ph" data-o="${c.id}:${i}" aria-label="${g(it.name)}">${img(it,ci<1&&i<2)}</button>
  <div class="body"><div class="top"><h3 class="name">${g(it.name)}</h3>${prices(it)}</div><p class="desc">${g(it.desc)}</p>
  <div class="opts">${(it.sizes||[]).map(s=>`<span class="opt">${g(s.l)}${s.p!=null?" · "+fmt(s.p):""}</span>`).join("")}${(it.addons||[]).map(a=>`<span class="opt add">+ ${g(a.n)}${a.p!=null?" "+fmt(a.p):""}</span>`).join("")}</div></div></article>`).join("")+`</div></section>`).join("")
  +`<div class="note">${T[L].ph}</div>`;

 spy();setOn(keep,1);if(keep!="top"&&keep){lock=1;document.getElementById(keep).scrollIntoView({behavior:"auto"});setTimeout(()=>lock=0,120)}
}
function openItem(k){const [cid,i]=k.split(":");const it=MENU.find(c=>c.id==cid).items[i];
 $("#sheet").innerHTML=`<button class="x" aria-label="Close">×</button><div class="ph">${img(it)}</div><div class="body"><div class="top"><h3>${g(it.name)}</h3>${prices(it)}</div><p class="desc">${g(it.desc)}</p>
 ${it.sizes?`<h4>${T[L].size}</h4>`+it.sizes.map(s=>`<div class="row"><span>${g(s.l)}</span><b>${fmt(s.p)}</b></div>`).join(""):""}
 ${it.addons?`<h4>${T[L].add}</h4>`+it.addons.map(a=>`<div class="row"><span>+ ${g(a.n)}</span><b>${fmt(a.p)}</b></div>`).join(""):""}</div>`;
 $("#modal").classList.add("open");document.body.style.overflow="hidden";lastBtn=document.activeElement;$(".x").focus({preventScroll:true});}
let lastBtn;function closeM(){if(!$("#modal").classList.contains("open"))return;$("#modal").classList.remove("open");document.body.style.overflow="";$("#sheet").innerHTML="";lastBtn&&lastBtn.focus({preventScroll:true})}
let io,cur="top",lock=0,lt;
function spy(){io&&io.disconnect();
 io=new IntersectionObserver(es=>{if(lock)return;es.forEach(e=>{if(e.isIntersecting)setOn(e.target.id)})},{rootMargin:"-30% 0px -60% 0px"});
 document.querySelectorAll("section.cat").forEach(s=>io.observe(s))}
function setOn(id,force){if(id==cur&&!force)return;cur=id;const sc=$("#cats");let el;
 sc.querySelectorAll(".chip").forEach(c=>{const on=c.dataset.c==id;c.classList.toggle("on",on);if(on)el=c});
 if(!el)return;const rtl=document.dir=="rtl"||document.documentElement.dir=="rtl";
 let x=el.offsetLeft+el.offsetWidth/2-sc.clientWidth/2;if(rtl)x-=sc.scrollWidth-sc.clientWidth;
 sc.scrollTo({left:x,behavior:force?"auto":"smooth"})}
function go(id){lock=1;clearTimeout(lt);setOn(id);const done=()=>{lock=0};
 if(id=="top")window.scrollTo({top:0,behavior:"smooth"});else document.getElementById(id).scrollIntoView({behavior:"smooth"});
 lt=setTimeout(done,900);addEventListener("scrollend",()=>{clearTimeout(lt);setTimeout(done,60)},{once:true})}
document.addEventListener("click",e=>{
 const c=e.target.closest(".chip");if(c){go(c.dataset.c);return}
 const o=e.target.closest("[data-o]");if(o)return openItem(o.dataset.o);
 if(e.target.closest(".x")||e.target.id=="modal")closeM();
 const l=e.target.closest(".lang button");if(l){L=l.dataset.l;try{localStorage.setItem("karoLang",L)}catch(x){}render()}
});
document.addEventListener("keydown",e=>{if(e.key=="Escape")closeM()});
$("#hrs").onclick=function(){const o=$("#hoursBox").classList.toggle("open");this.setAttribute("aria-expanded",o)};
$("#wifi").onclick=()=>{if(WIFI_LINK){location.href=WIFI_LINK}else{const t=$("#toast");t.textContent=T[L].noWifi;t.style.display="block";setTimeout(()=>t.style.display="none",2200)}};
render();
</script>
</body>
</html>
